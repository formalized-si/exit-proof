<!doctype html>
<meta charset="utf-8" />
<title>Exit Proof</title>
<link rel="stylesheet" href="design.css" />
<style>
  body { height: 450px; }
  header { margin: 0 26px; padding: 16px 18px 0; min-height: 62px; display: flex; align-items: center; }
  main { padding: 14px 44px 0; }
  h1 { margin: 12px 0 0; font: 500 66px/0.98 var(--sans); letter-spacing: -0.05em; }
  h1 span { display: block; }
  h1 span:last-child { color: var(--orange); }
  h2 { margin: 22px 0 12px; font: 500 25px/1.18 var(--sans); letter-spacing: -0.03em; color: #fff; }
  .facts { display: grid; grid-template-columns: 1fr 1fr 1fr; border-top: 1px solid rgb(255 255 255 / .4); }
  .facts > div { padding: 14px 22px 0; border-left: 1px solid rgb(255 255 255 / .16); }
  .facts > div:first-child { padding-left: 0; border-left: 0; }
  .facts .label { font: 400 11px/1.5 var(--mono); color: rgb(255 255 255 / .6); white-space: nowrap; }
  .facts strong { display: block; margin-top: 8px; font: 500 62px/1 var(--sans); letter-spacing: -0.05em; color: #fff; }
  .facts .bad { color: #ff8466; }
  .facts .good { color: #8fd19e; }
</style>
<body class="dark">
  <header>
    <div class="brand-line">
      <img src="../../../web/assets/formalized-white.svg" alt="formalized" />
      <div class="brand">Exit Proof</div>
    </div>
  </header>
  <main>
    <p class="eyebrow">Exit stages for NEAR contracts · registry on NEAR mainnet</p>
    <h1><span>Can you always</span><span>get it back?</span></h1>
    <h2>Every contract gets an exit stage. The top one takes a proof.</h2>
    <div class="facts">
      <div><span class="label">Staked NEAR at stage 2, proven exit</span><strong>86.2%</strong></div>
      <div><span class="label">Large contracts at stage 0, of 28</span><strong class="bad">22</strong></div>
      <div><span class="label">Disagreements in 311 697</span><strong class="good">0</strong></div>
    </div>
  </main>
</body>
