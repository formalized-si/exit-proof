[package]
name = "ftmon"
version = "1.0.0"
edition = "2024"
publish = false

[[bin]]
name = "ftmon"
path = "src/main.rs"

[dependencies]
# The public simulator at a pinned commit. It pins nearcore itself (tag 2.14.0); Cargo.lock records
# the exact commits of both, and the kit builds with --locked.
near-contract-sim = { git = "https://github.com/near/near-contract-sim", rev = "8e4b69b999c185a1a26fa5e025db042436888856" }
serde_json = { version = "1", features = ["arbitrary_precision", "float_roundtrip"] }
wat = "1"
base64 = "0.22"
